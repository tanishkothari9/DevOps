apiVersion: v1
kind: Pod
metadata:
  name: {{ include "stockpilot.fullname" . }}-test-api
  labels:
    {{- include "stockpilot.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: smoke
      image: busybox:1.37
      command:
        - sh
        - -c
        - |
          set -e
          wget -qO- http://{{ include "stockpilot.fullname" . }}-backend:{{ .Values.backend.port }}/ready
          echo
          wget -qO- http://{{ include "stockpilot.fullname" . }}-frontend/api/info
          echo
          wget -qO- http://{{ include "stockpilot.fullname" . }}-frontend/healthz
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: ["ALL"]}
      resources:
        requests: {cpu: 10m, memory: 8Mi}
        limits: {cpu: 50m, memory: 32Mi}
