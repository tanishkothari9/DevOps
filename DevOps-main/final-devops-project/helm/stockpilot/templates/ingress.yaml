{{- $fullname := include "stockpilot.fullname" . -}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "stockpilot.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: {name: {{ $fullname }}-backend, port: {name: http}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: {{ $fullname }}-frontend, port: {name: http}}
{{- end }}
