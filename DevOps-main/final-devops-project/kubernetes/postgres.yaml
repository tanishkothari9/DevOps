# PostgreSQL: PVC for durable storage + headless-style Service + single-replica StatefulSet.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stockpilot-postgres-data
  labels: {app: stockpilot-postgres}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: stockpilot-postgres
  labels: {app: stockpilot-postgres}
spec:
  selector: {app: stockpilot-postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stockpilot-postgres
  labels: {app: stockpilot-postgres}
spec:
  serviceName: stockpilot-postgres
  replicas: 1
  selector:
    matchLabels: {app: stockpilot-postgres}
  template:
    metadata:
      labels: {app: stockpilot-postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - name: POSTGRES_DB
              valueFrom: {configMapKeyRef: {name: stockpilot-config, key: DB_NAME}}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: stockpilot-db, key: DB_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: stockpilot-db, key: DB_PASSWORD}}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec: {command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: stockpilot-postgres-data}
