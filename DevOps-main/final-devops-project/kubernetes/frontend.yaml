# React build served by unprivileged nginx on :8080, read-only root filesystem.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockpilot-frontend
  labels: {app: stockpilot-frontend}
spec:
  replicas: 2
  selector:
    matchLabels: {app: stockpilot-frontend}
  template:
    metadata:
      labels: {app: stockpilot-frontend}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: frontend
          image: stockpilot-frontend:local
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: BACKEND_URL, value: "http://stockpilot-backend:8000"}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: nginx-conf, mountPath: /etc/nginx/conf.d}
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: nginx-conf, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: stockpilot-frontend
  labels: {app: stockpilot-frontend}
spec:
  type: ClusterIP
  selector: {app: stockpilot-frontend}
  ports:
    - {name: http, port: 80, targetPort: http}
