# DUMMY development credentials only. In a real cluster this Secret is created out-of-band
# (Sealed Secrets / External Secrets Operator / Vault) and never committed with real values.
apiVersion: v1
kind: Secret
metadata:
  name: stockpilot-db
  labels: {app.kubernetes.io/part-of: stockpilot}
type: Opaque
stringData:
  DB_USER: stockpilot
  DB_PASSWORD: dev-only-change-me
