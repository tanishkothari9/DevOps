# Scale the backend between 2 and 5 pods on CPU (needs metrics-server and CPU requests on the pods).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stockpilot-backend
  labels: {app.kubernetes.io/part-of: stockpilot}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: stockpilot-backend}
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
