# kubectl apply -f kubernetes/namespace.yaml && kubectl apply -k kubernetes/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: taskboard
resources:
  - configmap.yaml
  - secret.yaml
  - postgres.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
  - hpa.yaml
images:
  - name: stockpilot-backend
    newTag: local
  - name: stockpilot-frontend
    newTag: local
