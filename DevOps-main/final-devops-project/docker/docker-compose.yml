# StockPilot local stack: PostgreSQL + FastAPI + React/nginx.
# Usage (from this folder):  docker compose up --build -d
name: stockpilot

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stockpilot
      POSTGRES_USER: stockpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockpilot-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpilot -d stockpilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../application/backend
    image: stockpilot-backend:local
    environment:
      DATABASE_URL: postgresql+psycopg://stockpilot:${POSTGRES_PASSWORD:-stockpilot-local}@postgres:5432/stockpilot
      APP_ENV: docker-compose
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8010:8000"

  frontend:
    build:
      context: ../application/frontend
    image: stockpilot-frontend:local
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"

volumes:
  postgres-data:
