# Fix: use the fully-qualified service name <service>.<namespace>.svc.cluster.local
apiVersion: v1
kind: Pod
metadata:
  name: frontend
  namespace: s14-dns
spec:
  containers:
    - name: frontend
      image: busybox:1.36
      env:
        - name: BACKEND_URL
          value: "http://orders-api.s14-dns-backend.svc.cluster.local"
      command: ["sh", "-c", "while true; do echo \"$(date +%T) calling $BACKEND_URL\"; wget -q -T 3 -O /dev/null $BACKEND_URL && echo OK || echo FAILED; sleep 5; done"]
