# Frontend in namespace s14-dns calls the backend using the SHORT name "orders-api".
# A short name only resolves inside the caller's own namespace -> "bad address".
apiVersion: v1
kind: Namespace
metadata:
  name: s14-dns
---
apiVersion: v1
kind: Pod
metadata:
  name: frontend
  namespace: s14-dns
spec:
  containers:
    - name: frontend
      image: busybox:1.36
      env:
        - name: BACKEND_URL
          value: "http://orders-api"
      command: ["sh", "-c", "while true; do echo \"$(date +%T) calling $BACKEND_URL\"; wget -q -T 3 -O /dev/null $BACKEND_URL && echo OK || echo FAILED; sleep 5; done"]
