# Configuration issue: the Deployment reads
#   - APP_MODE from ConfigMap "app-config" key "mode"   (ConfigMap has "app_mode", not "mode")
#   - DB_PASSWORD from Secret "db-credentials"          (Secret was never created)
# -> CreateContainerConfigError
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  app_mode: "production"
  log_level: "info"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-app
  template:
    metadata:
      labels:
        app: config-app
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo \"mode=$APP_MODE log=$LOG_LEVEL password-length=${#DB_PASSWORD}\"; sleep 3600"]
          env:
            - name: APP_MODE
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: mode
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: log_level
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
