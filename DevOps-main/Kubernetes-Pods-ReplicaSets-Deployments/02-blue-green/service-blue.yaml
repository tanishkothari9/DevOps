# Service selector points at the BLUE slot. Switching traffic = re-applying the other file.
apiVersion: v1
kind: Service
metadata:
  name: myapp-service
  labels:
    app: myapp
spec:
  type: NodePort
  selector:
    app: myapp
    slot: blue     # <-- traffic goes to BLUE (v1)
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
