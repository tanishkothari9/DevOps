# Healthy baseline for the broken-image drill (same Deployment name as broken-image.yaml)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-backend
  labels:
    app: yatri-backend
    version: "v1"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: yatri-backend
  template:
    metadata:
      labels:
        app: yatri-backend
        version: "v1"
    spec:
      containers:
        - name: backend
          image: python:3.11-alpine3.19
          command: ["python3", "-m", "http.server", "5000"]
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
