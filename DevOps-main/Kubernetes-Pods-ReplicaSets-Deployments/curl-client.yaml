# Tiny in-cluster client used to send traffic to the Services
apiVersion: v1
kind: Pod
metadata:
  name: curl-client
spec:
  containers:
    - name: client
      image: curlimages/curl:8.5.0
      command: ["sh", "-c", "sleep 36000"]
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
