# Selects ONLY app=myapp-canary (not track) so both stable and canary pods receive traffic.
apiVersion: v1
kind: Service
metadata:
  name: myapp-canary-service
  labels:
    app: myapp-canary
spec:
  type: NodePort
  selector:
    app: myapp-canary
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
