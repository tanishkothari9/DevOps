# ReplicaSet: keeps 3 identical Pods alive. Delete one and it is recreated (self-healing).
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: yatri-backend-rs
  labels:
    app: yatri-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: yatri-backend
  template:
    metadata:
      labels:
        app: yatri-backend
    spec:
      containers:
        - name: backend
          image: python:3.11-alpine3.19
          command: ["python3", "-m", "http.server", "5000"]
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
