# Secret = sensitive values. NOTE: base64 is ENCODING, not encryption.
# All values below are OBVIOUSLY DUMMY demo values - never commit real credentials.
#   echo -n 'demo_user'          | base64  -> ZGVtb191c2Vy
#   echo -n 'dummy-password-123' | base64  -> ZHVtbXktcGFzc3dvcmQtMTIz
#   echo -n 'demo_db'            | base64  -> ZGVtb19kYg==
apiVersion: v1
kind: Secret
metadata:
  name: yatri-db-secret
  labels:
    app: yatri-backend
type: Opaque
data:
  POSTGRES_USER: ZGVtb191c2Vy
  POSTGRES_PASSWORD: ZHVtbXktcGFzc3dvcmQtMTIz
  POSTGRES_DB: ZGVtb19kYg==
