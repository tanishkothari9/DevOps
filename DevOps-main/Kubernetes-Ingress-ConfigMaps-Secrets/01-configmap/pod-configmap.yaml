# Consumes the ConfigMap in 3 ways: envFrom (all keys), env (one key, renamed), volume (files)
apiVersion: v1
kind: Pod
metadata:
  name: configmap-demo
  labels:
    app: configmap-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo \"Booting in $ENVIRONMENT with LOG_LEVEL=$LOG_LEVEL\"; sleep 36000"]
      envFrom:
        - configMapRef:
            name: yatri-app-config        # every key becomes an env var
      env:
        - name: APP_CURRENCY              # one key, under a different name
          valueFrom:
            configMapKeyRef:
              name: yatri-app-config
              key: DEFAULT_CURRENCY
      volumeMounts:
        - name: config-volume
          mountPath: /etc/config          # every key becomes a file here
          readOnly: true
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
        limits:
          cpu: "50m"
          memory: "32Mi"
  volumes:
    - name: config-volume
      configMap:
        name: yatri-app-config
