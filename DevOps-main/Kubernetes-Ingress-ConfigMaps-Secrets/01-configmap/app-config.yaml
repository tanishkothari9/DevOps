# ConfigMap = NON-sensitive configuration, stored as plain text.
# Adapted from devops-heros/session-12-ingress-configmaps-secrets/01-configmap/app-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: yatri-app-config
  labels:
    app: yatri-backend
data:
  # simple key/value pairs -> injected as environment variables
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  PORT: "5000"
  DEFAULT_CURRENCY: "INR"
  MAX_BOOKING_DAYS: "30"
  # a whole file -> mounted into the container through a volume
  app.properties: |
    app.name=yatri
    feature.new-booking-ui=true
    cache.ttl.seconds=300
