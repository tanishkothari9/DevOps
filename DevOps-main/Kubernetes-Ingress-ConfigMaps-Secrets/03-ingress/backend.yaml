# Backend: tiny Python HTTP API that reads its config from the ConfigMap + Secret
# (adapted from devops-heros/session-12-ingress-configmaps-secrets/04-full-demo/backend.yaml)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-backend
  labels:
    app: yatri-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yatri-backend
  template:
    metadata:
      labels:
        app: yatri-backend
    spec:
      containers:
        - name: backend
          image: python:3.11-alpine3.19
          command:
            - "python3"
            - "-c"
            - |
              import os, socket
              from http.server import HTTPServer, BaseHTTPRequestHandler
              class Handler(BaseHTTPRequestHandler):
                  def log_message(self, format, *args):
                      pass
                  def do_GET(self):
                      body = (
                          'Yatri BACKEND API\n'
                          f'host header     : {self.headers.get("Host")}\n'
                          f'path            : {self.path}\n'
                          f'served by pod   : {socket.gethostname()}\n'
                          f'ENVIRONMENT     : {os.getenv("ENVIRONMENT")}\n'
                          f'DEFAULT_CURRENCY: {os.getenv("DEFAULT_CURRENCY")}\n'
                          f'POSTGRES_USER   : {os.getenv("POSTGRES_USER")}\n'
                          f'POSTGRES_DB     : {os.getenv("POSTGRES_DB")}\n'
                      ).encode()
                      self.send_response(200)
                      self.send_header('Content-Type', 'text/plain')
                      self.send_header('Content-Length', str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
              HTTPServer(('0.0.0.0', 5000), Handler).serve_forever()
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: yatri-app-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: yatri-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: yatri-db-secret
                  key: POSTGRES_DB
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: yatri-backend-service
  labels:
    app: yatri-backend
spec:
  type: ClusterIP
  selector:
    app: yatri-backend
  ports:
    - name: http
      port: 80
      targetPort: 5000
