apiVersion: v1
kind: Pod
metadata:
  name: static-storage-demo
  namespace: s13-volumes
spec:
  containers:
    - name: app
      image: nginx:1.27
      volumeMounts:
        - name: persistent-storage
          mountPath: /data
  volumes:
    - name: persistent-storage
      persistentVolumeClaim:
        claimName: static-pvc
