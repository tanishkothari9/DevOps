# emptyDir shared by two containers in the same Pod.
# "writer" appends a line every 5s, "web" (nginx) serves the same directory.
apiVersion: v1
kind: Pod
metadata:
  name: emptydir-demo
  namespace: s13-volumes
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "while true; do echo \"written by writer at $(date)\" >> /shared/index.html; sleep 5; done"]
      volumeMounts:
        - name: shared-data
          mountPath: /shared
    - name: web
      image: nginx:1.27
      volumeMounts:
        - name: shared-data
          mountPath: /usr/share/nginx/html
  volumes:
    - name: shared-data
      emptyDir: {}
