# In-cluster load generator: 3 busybox workers hitting the Service in a tight loop.
# Running inside the cluster means traffic goes through the Service and is spread
# across all backend Pods (a port-forward would only hit one Pod).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: s13-hpa-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      containers:
        - name: load
          image: busybox:1.36
          command: ["/bin/sh", "-c", "while true; do wget -q -O- http://yatri-backend-service > /dev/null; done"]
          resources:
            requests:
              cpu: 20m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
