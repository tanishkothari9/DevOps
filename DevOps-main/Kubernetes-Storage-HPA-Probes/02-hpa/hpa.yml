# HPA hands-on: application (Deployment + Service) and the HorizontalPodAutoscaler.
# Based on the instructor's hpa/hpa-backend.yaml + backend-service.yaml (yatri-backend).
# The backend is a tiny Python HTTP server (python:3.11-alpine, multi-arch so it runs on
# the arm64 minikube node). Like the classic php-apache "hpa-example" image (amd64 only),
# every request runs a CPU-heavy loop, so CPU rises quickly under load.
apiVersion: v1
kind: Namespace
metadata:
  name: s13-hpa-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-backend
  namespace: s13-hpa-demo
  labels:
    app: yatri-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yatri-backend
  template:
    metadata:
      labels:
        app: yatri-backend
    spec:
      containers:
        - name: backend
          image: python:3.11-alpine
          command: ["python3", "-u", "-c"]
          args:
            - |
              import math
              from http.server import ThreadingHTTPServer, BaseHTTPRequestHandler
              class Handler(BaseHTTPRequestHandler):
                  def do_GET(self):
                      x = 0.0001
                      for i in range(300000):      # CPU-heavy work per request
                          x += math.sqrt(i)
                      body = b"OK!\n"
                      self.send_response(200)
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)
                  def log_message(self, *args):
                      pass
              print("yatri-backend listening on :5000", flush=True)
              ThreadingHTTPServer(("0.0.0.0", 5000), Handler).serve_forever()
          ports:
            - containerPort: 5000
          readinessProbe:
            tcpSocket:
              port: 5000
            periodSeconds: 5
          resources:
            requests:
              cpu: 200m        # HPA % is calculated against this request
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: yatri-backend-service
  namespace: s13-hpa-demo
  labels:
    app: yatri-backend
spec:
  type: ClusterIP
  selector:
    app: yatri-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: yatri-backend-hpa
  namespace: s13-hpa-demo
  labels:
    app: yatri-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: yatri-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
