# Broken readiness probe: Pod keeps Running (no restarts) but is NOT Ready,
# so the Service has no endpoints and receives no traffic.
apiVersion: v1
kind: Pod
metadata:
  name: readiness-fail-demo
  namespace: s13-probes
  labels:
    app: readiness-fail-demo
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
      readinessProbe:
        httpGet:
          path: /not-ready
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: readiness-fail-svc
  namespace: s13-probes
spec:
  selector:
    app: readiness-fail-demo
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: readiness-demo-svc
  namespace: s13-probes
spec:
  selector:
    app: readiness-demo
  ports:
    - port: 80
      targetPort: 80
