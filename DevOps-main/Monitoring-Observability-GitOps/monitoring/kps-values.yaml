# kube-prometheus-stack values - tuned for a small, shared minikube node.
# helm upgrade --install kps prometheus-community/kube-prometheus-stack -n monitoring --create-namespace -f kps-values.yaml

# Control-plane components are not reachable from inside minikube (they bind to 127.0.0.1),
# so scraping them only produces false "TargetDown" alerts.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
# The API server's /metrics page is huge; scraping it took ~17s and added load to an already busy
# shared control plane, so it is not scraped in this lab.
kubeApiServer:
  enabled: false

# On the crowded shared node the kubelet's /metrics and /metrics/cadvisor pages took >25s and timed
# out. Container CPU / memory (container_cpu_usage_seconds_total, container_memory_working_set_bytes)
# are instead taken from the much smaller /metrics/resource endpoint - the same data metrics-server
# uses for `kubectl top`.
kubelet:
  serviceMonitor:
    kubelet: false
    cAdvisor: false
    resource: true
    resourcePath: /metrics/resource
    resourceInterval: 30s

prometheus:
  prometheusSpec:
    retention: 6h
    scrapeInterval: 30s
    # the kubelet /metrics endpoint answers slowly on a busy single-node minikube;
    # the default 10s timeout marked it DOWN, so allow up to 25s
    scrapeTimeout: 25s
    evaluationInterval: 30s
    # Pick up ServiceMonitors / PodMonitors / PrometheusRules from ANY namespace and with ANY labels
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 1536Mi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

# The shared minikube node is CPU-starved at times; 1s probe timeouts caused needless restarts.
prometheusOperator:
  livenessProbe:
    timeoutSeconds: 10
    failureThreshold: 6
  readinessProbe:
    timeoutSeconds: 10
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

kube-state-metrics:
  livenessProbe:
    timeoutSeconds: 10
    failureThreshold: 6
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  livenessProbe:
    timeoutSeconds: 10
    failureThreshold: 6
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      memory: 64Mi

grafana:
  adminPassword: s20-demo-admin   # demo-only password for a local lab cluster
  # 384Mi was OOMKilled while rendering dashboards (Grafana 13), so allow 768Mi
  resources:
    requests:
      cpu: 20m
      memory: 192Mi
    limits:
      memory: 768Mi
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Viewer
