# Applied once from the admin machine (kubectl apply -f gitops/argocd-application.yaml).
# It lives OUTSIDE gitops/app/ so Argo CD does not try to manage itself.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: s20-gitops-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/tanishkothari9/DevOps.git
    targetRevision: main
    path: DevOps-main/Monitoring-Observability-GitOps/gitops/app

  destination:
    server: https://kubernetes.default.svc
    namespace: s20-gitops

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
