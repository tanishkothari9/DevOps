apiVersion: apps/v1
kind: Deployment
metadata:
  name: session16-calculator
  namespace: cicd
  labels:
    app: session16-calculator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: session16-calculator
  template:
    metadata:
      labels:
        app: session16-calculator
    spec:
      containers:
        - name: calculator
          # CI replaces this with ghcr.io/<owner>/session16-calculator:<git-sha>
          image: session16-calculator:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          startupProbe: # give slow nodes up to 150s to boot gunicorn
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
