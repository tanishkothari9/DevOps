# =====================================================================
# Session 16 - CI/CD with GitHub Actions
# App folder : DevOps-main/CICD-GitHub-Actions
#
#   CI  : test (lint + pytest)  ->  build (artifact) + security-check
#         ->  docker-build (image artifact)
#   CD  : push-image (GHCR, Continuous Delivery)
#         ->  deploy (kind Kubernetes cluster, Continuous Deployment)
# =====================================================================
name: Session 16 - CI/CD Pipeline

# ---- Trigger: WHEN does this workflow run? ----
on:
  push:
    branches: [main]
    paths:
      - "DevOps-main/CICD-GitHub-Actions/**"
      - ".github/workflows/session16-cicd.yml"
  workflow_dispatch: # manual "Run workflow" button
    inputs:
      break_tests:
        description: "Inject a bug into calculator.add() at runtime to watch the pipeline fail"
        type: boolean
        default: false

# Least privilege by default - jobs ask for more only when needed
permissions:
  contents: read

concurrency:
  group: session16-${{ github.ref }}-${{ inputs.break_tests || false }}
  cancel-in-progress: true

env:
  APP_DIR: DevOps-main/CICD-GitHub-Actions
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/session16-calculator
  PYTHON_VERSION: "3.12"

# Every `run:` step executes inside the app folder
defaults:
  run:
    working-directory: DevOps-main/CICD-GitHub-Actions

jobs:
  # -------------------------------------------------------------------
  # CI - JOB 1: lint + unit tests
  # -------------------------------------------------------------------
  test:
    name: "CI - Lint & Unit Tests"
    runs-on: ubuntu-latest # GitHub-hosted runner
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/requirements*.txt

      - name: Show runner details
        run: |
          echo "Runner name : ${{ runner.name }}"
          echo "Runner OS   : ${{ runner.os }} (${{ runner.arch }})"
          echo "Event       : ${{ github.event_name }} by ${{ github.actor }}"
          echo "Commit      : ${{ github.sha }}"
          python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 app tests

      # Failure demo (workflow_dispatch only): introduce the classic
      # "a + b + 1" bug in the checked-out copy - nothing is committed.
      - name: Inject bug (break_tests=true)
        if: inputs.break_tests
        run: |
          sed -i 's/return a + b$/return a + b + 1/' app/calculator.py
          echo "::warning::break_tests=true -> add() now returns a + b + 1"
          grep -n -A1 "def add" app/calculator.py

      - name: Run unit tests (pytest + coverage)
        run: |
          pytest -v \
            --junitxml=reports/junit.xml \
            --cov=app --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml

      - name: Upload test reports (artifact)
        if: always() # keep reports even when tests fail
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: ${{ env.APP_DIR }}/reports/
          retention-days: 7

  # -------------------------------------------------------------------
  # CI - JOB 2: build the application package -> artifact
  # -------------------------------------------------------------------
  build:
    name: "CI - Build Application"
    needs: test # runs only if tests passed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Build application
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: calculator-build
          path: ${{ env.APP_DIR }}/build/
          retention-days: 7

  # -------------------------------------------------------------------
  # CI - JOB 3: basic security check (runs in parallel with build)
  # -------------------------------------------------------------------
  security-check:
    name: "CI - Security Check"
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Check for committed sensitive files
        run: |
          echo "Checking app folder for common sensitive files..."
          if find . -type f \( -name ".env" -o -name "*.pem" -o -name "*.key" \) | grep .; then
            echo "Potential sensitive file found."
            exit 1
          fi
          echo "No common sensitive files found."

  # -------------------------------------------------------------------
  # CI - JOB 4: build + smoke-test the Docker image -> image artifact
  # -------------------------------------------------------------------
  docker-build:
    name: "CI - Docker Build & Smoke Test"
    needs: [build, security-check] # fan-in: waits for BOTH jobs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_VERSION=${{ github.sha }} \
            -t session16-calculator:${{ github.sha }} .
          docker image ls session16-calculator

      - name: Smoke test the container
        run: |
          docker run -d --name smoke -p 8000:8000 session16-calculator:${{ github.sha }}
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8000/health && break
            sleep 1
          done
          echo
          curl -fsS "http://localhost:8000/api/add?a=10&b=5"
          echo
          docker rm -f smoke

      - name: Save image as tarball
        run: docker save session16-calculator:${{ github.sha }} | gzip > image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v6
        with:
          name: docker-image
          path: ${{ env.APP_DIR }}/image.tar.gz
          retention-days: 1

  # -------------------------------------------------------------------
  # CD - JOB 5: Continuous DELIVERY - push the tested image to GHCR
  # -------------------------------------------------------------------
  push-image:
    name: "CD - Push Image to GHCR"
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # allow GITHUB_TOKEN to push to ghcr.io
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v7
        with:
          name: docker-image
          path: ${{ env.APP_DIR }}

      - name: Load image
        run: gunzip -c image.tar.gz | docker load

      - name: Secrets demo - GITHUB_TOKEN is masked in logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Secret available : $([ -n "$GH_TOKEN" ] && echo yes || echo no)"
          echo "Secret length    : ${#GH_TOKEN} characters"
          echo "Printing secret  : $GH_TOKEN"

      - name: Login to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag and push image
        id: push
        run: |
          docker tag session16-calculator:${{ github.sha }} $IMAGE_NAME:${{ github.sha }}
          docker tag session16-calculator:${{ github.sha }} $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest
          echo "image=$IMAGE_NAME:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "### Pushed image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE_NAME:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------
  # CD - JOB 6: Continuous DEPLOYMENT - deploy to Kubernetes (kind)
  # -------------------------------------------------------------------
  deploy:
    name: "CD - Deploy to Kubernetes (kind)"
    needs: push-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read # pull the image back from GHCR
    env:
      IMAGE: ${{ needs.push-image.outputs.image }} # job output from previous job
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: session16

      - name: Create namespace and GHCR pull secret
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl create secret docker-registry ghcr-pull -n cicd \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="$GH_TOKEN"
          until kubectl get serviceaccount default -n cicd >/dev/null 2>&1; do sleep 1; done
          kubectl patch serviceaccount default -n cicd \
            -p '{"imagePullSecrets":[{"name":"ghcr-pull"}]}'

      - name: Deploy manifests
        run: |
          echo "Deploying $IMAGE"
          sed -i "s|image: session16-calculator:local|image: $IMAGE|" k8s/deployment.yaml
          kubectl apply -f k8s/deployment.yaml -f k8s/service.yaml

      - name: Wait for rollout
        run: kubectl rollout status deployment/session16-calculator -n cicd --timeout=180s

      - name: Verify deployment
        run: |
          kubectl get deploy,pods,svc -n cicd -o wide
          kubectl port-forward -n cicd service/session16-calculator 8080:80 >/dev/null 2>&1 &
          sleep 3
          curl -fsS http://localhost:8080/health; echo
          curl -fsS "http://localhost:8080/api/multiply?a=6&b=7"; echo
          {
            echo "### Deployed to kind"
            echo "Image: \`$IMAGE\`"
            echo '```'
            kubectl get pods -n cicd
            curl -fsS http://localhost:8080/health
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
